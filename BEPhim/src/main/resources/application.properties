spring.application.name=BEPhim
server.port=8080

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/webphim?replicaSet=rs0}

# External API base
ophim.base-url=${OPHIM_BASE_URL:https://ophim1.com/v1/api/}
ophim.connect-timeout=${OPHIM_CONNECT_TIMEOUT:2s}
ophim.read-timeout=${OPHIM_READ_TIMEOUT:8s}

# OAuth/OIDC public URLs
app.auth.issuer=${APP_AUTH_ISSUER:http://localhost:8080}
app.auth.spa-redirect-uri=${APP_AUTH_SPA_REDIRECT_URI:http://localhost:5173/callback}
app.auth.spa-post-logout-redirect-uri=${APP_AUTH_SPA_POST_LOGOUT_REDIRECT_URI:http://localhost:5173/}
app.public-url=${APP_PUBLIC_URL:http://localhost:5173}
app.auth.refresh-cookie.secure=${APP_AUTH_REFRESH_COOKIE_SECURE:false}
app.auth.refresh-cookie.same-site=${APP_AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Per-instance request limits
app.rate-limit.login-per-10-minutes=${APP_RATE_LIMIT_LOGIN:10}
app.rate-limit.register-per-hour=${APP_RATE_LIMIT_REGISTER:5}
app.rate-limit.forgot-password-per-hour=${APP_RATE_LIMIT_FORGOT_PASSWORD:5}
app.rate-limit.resend-verification-per-hour=${APP_RATE_LIMIT_RESEND_VERIFICATION:3}
app.rate-limit.refresh-per-10-minutes=${APP_RATE_LIMIT_REFRESH:60}
app.rate-limit.proxy-per-minute=${APP_RATE_LIMIT_PROXY:120}

# Mail
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SECURE:false}
app.mail.from=${MAIL_FROM:${SMTP_USER:}}
app.mail.outbox.encryption-key=${APP_MAIL_OUTBOX_ENCRYPTION_KEY:}
app.mail.outbox.poll-interval=${APP_MAIL_OUTBOX_POLL_INTERVAL:30s}
app.mail.outbox.max-attempts=${APP_MAIL_OUTBOX_MAX_ATTEMPTS:8}
app.mail.outbox.batch-size=${APP_MAIL_OUTBOX_BATCH_SIZE:20}

# Content Security Policy
app.security.csp.allowed-frame-hosts=${APP_SECURITY_CSP_ALLOWED_FRAME_HOSTS:}

# Actuator health probes
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Response compression
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,text/plain,text/html,text/xml,text/css,application/javascript

# Logging
logging.level.com.example.bephim=INFO
logging.level.org.springframework.security=INFO
