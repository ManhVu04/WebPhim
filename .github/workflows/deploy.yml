name: WebPhim CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webphim-production
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: BEPhim/pom.xml

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Start MongoDB replica set
        run: docker compose -f docker-compose.dev.yml up -d --wait mongo

      - name: Verify backend
        working-directory: BEPhim
        run: bash ./mvnw clean verify

      - name: Verify frontend
        working-directory: fe
        run: |
          npm ci
          npm run lint
          npm test
          npm run audit:ci

      - name: Build frontend for production
        working-directory: fe
        env:
          VITE_PUBLIC_SITE_URL: https://phimhaymienphi.id.vn
          PRERENDER_MAX_PAGES: "1"
          PRERENDER_CONCURRENCY: "3"
        run: npm run build:prerender

      - name: Package release
        run: |
          mkdir -p release/dist
          cp BEPhim/target/BEPhim-0.0.1-SNAPSHOT.jar release/app.jar
          cp -a fe/dist/. release/dist/
          tar -C release -czf webphim-release.tar.gz .
          sha256sum webphim-release.tar.gz > webphim-release.tar.gz.sha256

      - name: Upload release
        uses: actions/upload-artifact@v7
        with:
          name: webphim-release
          path: |
            webphim-release.tar.gz
            webphim-release.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Stop test MongoDB
        if: always()
        run: docker compose -f docker-compose.dev.yml down --remove-orphans

  deploy:
    name: Deploy to EC2
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download tested release
        uses: actions/download-artifact@v8
        with:
          name: webphim-release
          path: artifact

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: webphim-${{ github.run_id }}

      - name: Upload release to private S3 bucket
        id: upload
        env:
          AWS_DEPLOY_BUCKET: ${{ vars.AWS_DEPLOY_BUCKET }}
        run: |
          s3_uri="s3://${AWS_DEPLOY_BUCKET}/webphim/releases/${GITHUB_SHA}.tar.gz"
          aws s3 cp artifact/webphim-release.tar.gz "$s3_uri" --only-show-errors
          aws s3 cp artifact/webphim-release.tar.gz.sha256 "${s3_uri}.sha256" --only-show-errors
          echo "s3_uri=$s3_uri" >> "$GITHUB_OUTPUT"

      - name: Deploy through AWS Systems Manager
        env:
          AWS_INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
          S3_URI: ${{ steps.upload.outputs.s3_uri }}
        run: |
          command_id="$(
            aws ssm send-command \
              --instance-ids "$AWS_INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Deploy WebPhim ${GITHUB_SHA}" \
              --parameters "commands=[\"/usr/local/sbin/fetch-deploy-webphim-s3 '${S3_URI}' '${GITHUB_SHA}'\"]" \
              --query 'Command.CommandId' \
              --output text
          )"

          set +e
          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$AWS_INSTANCE_ID"
          wait_status=$?
          set -e

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$AWS_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'

          exit "$wait_status"
